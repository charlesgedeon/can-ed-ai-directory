<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canadian University AI Approaches — the directory</title>
<meta name="description" content="A searchable directory of generative-AI policies, guidelines, and teaching resources published by Canadian universities.">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<a class="skip-link" href="#results">Skip to the directory</a>

<header class="masthead" data-chrome="header"></header>

<!-- Signature element: one tick per institution in the country. -->
<section class="ribbon" aria-labelledby="ribbon-label">
  <div class="wrap ribbon__inner">
    <h2 id="ribbon-label" class="sr-only">Coverage across Canadian institutions</h2>
    <div class="ribbon__ticks" id="ribbon"></div>
    <p class="ribbon__read" id="ribbon-read"></p>
  </div>
</section>

<div class="rail">
  <div class="wrap rail__inner">
    <div class="rail__row">
      <div class="search">
        <span class="search__icon" id="search-icon"></span>
        <label class="sr-only" for="q">Search institutions and documents</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search a university, a city, a document type…">
        <button class="search__clear" id="q-clear" type="button" aria-label="Clear search" hidden></button>
      </div>
      <button class="filters-toggle" id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters">
        <span id="filters-icon"></span> Filters <span class="badge" id="filters-count" hidden>0</span>
      </button>
    </div>

    <div class="rail__row rail__collapsible" id="filters">
      <label class="sr-only" for="f-province">Province</label>
      <select class="sel" id="f-province"><option value="">All provinces</option></select>

      <label class="sr-only" for="f-issuer">Issued by</label>
      <select class="sel" id="f-issuer"><option value="">Any issuing office</option></select>

      <label class="sr-only" for="f-type">Document type</label>
      <select class="sel" id="f-type"><option value="">Any document type</option></select>

      <label class="sr-only" for="f-status">Coverage</label>
      <select class="sel" id="f-status">
        <option value="">Everyone</option>
        <option value="has">Has published guidance</option>
        <option value="none">Nothing published yet</option>
      </select>

      <div class="chips" id="f-audience" role="group" aria-label="Audience"></div>
    </div>

    <div class="rail__meta">
      <span class="rail__count" id="count"></span>
      <button class="linkbtn" id="expand-all" type="button">Expand all</button>
      <button class="linkbtn" id="reset" type="button" hidden>Clear filters</button>
    </div>
  </div>
</div>

<main>
  <div class="wrap">
    <div id="prompt-slot"></div>
    <div id="results"></div>
  </div>
</main>

<footer data-chrome="footer"></footer>

<!-- Compare tray -->
<div class="cmpbar" id="cmpbar" data-show="0">
  <span id="cmpbar-text">2 selected</span>
  <button class="go" id="cmpbar-go" type="button">Compare</button>
  <button class="clr" id="cmpbar-clear" type="button">Clear</button>
</div>

<div class="sheet" id="cmp-sheet" role="dialog" aria-modal="true" aria-labelledby="cmp-title" data-show="0">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h3 id="cmp-title">Side by side</h3>
      <button class="iconbtn" id="cmp-close" type="button" aria-label="Close comparison"></button>
    </div>
    <div class="sheet__body" id="cmp-body"></div>
  </div>
</div>

<script src="assets/data-snapshot.js"></script>
<script src="assets/site.js"></script>
<script>
/* ==================================================================
   Directory page
   ================================================================== */
renderChrome("directory");

document.getElementById("search-icon").innerHTML  = ICON.search;
document.getElementById("q-clear").innerHTML      = ICON.x;
document.getElementById("filters-icon").innerHTML = ICON.sliders;
document.getElementById("cmp-close").innerHTML    = ICON.x;

const AUDIENCES = ["Instructors", "Students", "Researchers", "Everyone"];

let MODEL   = { list: [], byId: {} };
let PROMPTS = [];
const state = { q: "", province: "", issuer: "", type: "", status: "", audience: new Set() };
const open  = new Set();   // expanded institution ids
const picked = new Set();  // compare selection

/* ------------------------------------------------------------------
   Join the two tabs into one institution-centred model
   ------------------------------------------------------------------ */
function buildModel(data) {
  const docsByInst = new Map();
  (data.resources || []).filter(r => yes(r.Publish)).forEach(r => {
    const key = fold(r.Institution);
    if (!key) return;
    if (!docsByInst.has(key)) docsByInst.set(key, []);
    docsByInst.get(key).push({
      title:    r["Resource Title"] || "",
      url:      r.URL || "",
      type:     r["Document Type"] || "",
      issuer:   r["Issued By"] || "",
      unit:     r["Issuing Unit (verbatim)"] || "",
      audience: multi(r.Audience),
      scope:    r.Scope || "",
      stance:   r.Stance || "",
      format:   r.Format || "",
      language: r.Language || "",
      summary:  r.Summary || "",
      updated:  r["Last Reviewed"] || r["Date Published"] || "",
    });
  });

  const list = (data.institutions || [])
    .filter(i => yes(i.Publish) && i.Institution)
    .map(i => {
      const docs = docsByInst.get(fold(i.Institution)) || [];
      return {
        id: slug(i.Institution),
        name: i.Institution,
        province: i.Province || "",
        city: i.City || "",
        kind: i["Institution Type"] || "",
        language: i["Language of Instruction"] || "",
        note: i["Institution Notes"] || "",
        docs,
        audiences: [...new Set(docs.flatMap(d => d.audience))],
        issuers:   [...new Set(docs.map(d => d.issuer).filter(Boolean))],
        types:     [...new Set(docs.map(d => d.type).filter(Boolean))],
        // one lowercase blob so search is a single fast substring test
        hay: fold([
          i.Institution, i.Province, i.City, i["Institution Type"],
          ...docs.map(d => [d.title, d.type, d.issuer, d.unit, d.summary,
                            d.audience.join(" "), d.url].join(" ")),
        ].join(" ")),
      };
    })
    .sort((a, b) => a.name.localeCompare(b.name, "en"));

  return { list, byId: Object.fromEntries(list.map(i => [i.id, i])) };
}

/* ------------------------------------------------------------------
   Filtering
   ------------------------------------------------------------------ */
function passes(inst) {
  if (state.q && !inst.hay.includes(fold(state.q))) return false;
  if (state.province && inst.province !== state.province) return false;
  if (state.status === "has"  && !inst.docs.length) return false;
  if (state.status === "none" &&  inst.docs.length) return false;
  if (state.issuer && !inst.issuers.includes(state.issuer)) return false;
  if (state.type   && !inst.types.includes(state.type))     return false;
  for (const a of state.audience) if (!inst.audiences.includes(a)) return false;
  return true;
}

const activeCount = () =>
  (state.province ? 1 : 0) + (state.issuer ? 1 : 0) + (state.type ? 1 : 0) +
  (state.status ? 1 : 0) + state.audience.size;

/* ------------------------------------------------------------------
   Rendering
   ------------------------------------------------------------------ */
function docHtml(d) {
  const badges = [
    d.type   && `<span class="tag">${esc(d.type)}</span>`,
    d.scope  && `<span class="tag tag--n">${esc(d.scope)}</span>`,
    d.stance && `<span class="tag tag--n">${esc(d.stance)}</span>`,
    d.format === "PDF" && `<span class="tag tag--pdf">PDF</span>`,
    d.language && d.language !== "English" && `<span class="tag tag--n">${esc(d.language)}</span>`,
    ...d.audience.map(a => `<span class="tag tag--n">${esc(a)}</span>`),
  ].filter(Boolean).join("");

  const title = d.title
    ? esc(d.title)
    : `<span class="doc__untitled">${esc(d.type || "Untitled resource")}</span>`;

  return `
    <div class="doc">
      <div class="doc__title">${title}</div>
      ${badges ? `<div class="doc__meta">${badges}</div>` : ""}
      ${d.summary ? `<p class="doc__summary">${esc(d.summary)}</p>` : ""}
      ${d.unit ? `<p class="doc__unit">Published by ${esc(d.unit)}${
        d.updated ? ` · reviewed ${esc(d.updated)}` : ""}</p>` : ""}
      ${d.url ? `<a class="doc__go" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">
        Open the document ${ICON.ext}</a>` : ""}
    </div>`;
}

function cardHtml(inst) {
  const where = [inst.province, inst.city && inst.city.replace(/,\s*\w+$/, ""), inst.kind]
    .filter(Boolean).join(" · ");
  const isOpen = open.has(inst.id);
  const n = inst.docs.length;

  if (!n) {
    return `
      <article class="card card--empty" id="${inst.id}">
        <input class="cmp" type="checkbox" data-cmp="${inst.id}"
               ${picked.has(inst.id) ? "checked" : ""}
               aria-label="Add ${esc(inst.name)} to the comparison">
        <div class="card__top" style="cursor:default">
          <span>
            <span class="card__name">${esc(inst.name)}</span>
            <span class="card__where">${esc(where)}</span>
          </span>
        </div>
        <div class="card__tags"><span class="tag tag--none">Nothing published yet</span></div>
        <p class="nodocs">No public generative-AI guidance found.
          <a href="${SITE.contact}" target="_blank" rel="noopener noreferrer">Know of one?</a></p>
      </article>`;
  }

  const summary = [
    `<span class="tag tag--n">${plural(n, "document", "documents")}</span>`,
    ...inst.types.slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`),
    ...inst.audiences.slice(0, 3).map(a => `<span class="tag tag--n">${esc(a)}</span>`),
  ].join("");

  return `
    <article class="card" id="${inst.id}" data-open="${isOpen ? 1 : 0}">
      <input class="cmp" type="checkbox" data-cmp="${inst.id}"
             ${picked.has(inst.id) ? "checked" : ""}
             aria-label="Add ${esc(inst.name)} to the comparison">
      <button class="card__top" data-toggle="${inst.id}"
              aria-expanded="${isOpen}" aria-controls="docs-${inst.id}">
        <span>
          <span class="card__name">${esc(inst.name)}</span>
          <span class="card__where">${esc(where)}</span>
        </span>
        <span class="card__caret">${ICON.chevron}</span>
      </button>
      <div class="card__tags">${summary}</div>
      <div class="docs" id="docs-${inst.id}" ${isOpen ? "" : "hidden"}>
        ${inst.docs.map(docHtml).join("")}
      </div>
    </article>`;
}

function render() {
  const hits = MODEL.list.filter(passes);
  const root = document.getElementById("results");

  document.getElementById("count").textContent =
    hits.length === MODEL.list.length
      ? `${MODEL.list.length} institutions · ${MODEL.list.reduce((s, i) => s + i.docs.length, 0)} documents`
      : `${plural(hits.length, "institution", "institutions")} · ${
          hits.reduce((s, i) => s + i.docs.length, 0)} documents`;

  const n = activeCount();
  const badge = document.getElementById("filters-count");
  badge.hidden = !n; badge.textContent = n;
  document.getElementById("reset").hidden = !n && !state.q;
  document.getElementById("q-clear").hidden = !state.q;
  [["f-province", state.province], ["f-issuer", state.issuer],
   ["f-type", state.type], ["f-status", state.status]]
    .forEach(([id, v]) => document.getElementById(id).dataset.active = v ? "1" : "0");

  if (!hits.length) {
    root.innerHTML = `
      <div class="empty">
        <h3>Nothing matches those filters</h3>
        <p>Try a broader search, or clear the filters to see all ${MODEL.list.length} institutions.</p>
        <button class="chip" id="empty-reset" type="button">Clear filters</button>
      </div>`;
    document.getElementById("empty-reset").onclick = resetAll;
    syncUrl();
    return;
  }

  const groups = new Map();
  hits.forEach(i => {
    if (!groups.has(i.province)) groups.set(i.province, []);
    groups.get(i.province).push(i);
  });

  root.innerHTML = [...groups.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], "en"))
    .map(([province, items]) => {
      const docs = items.reduce((s, i) => s + i.docs.length, 0);
      return `
        <div class="province-head">
          <h2>${esc(province)}</h2>
          <span>${plural(items.length, "institution", "institutions")} · ${
            plural(docs, "document", "documents")}</span>
        </div>
        <div class="grid">${items.map(cardHtml).join("")}</div>`;
    }).join("");

  document.getElementById("expand-all").textContent =
    hits.every(i => !i.docs.length || open.has(i.id)) ? "Collapse all" : "Expand all";

  syncUrl();
}

/* ------------------------------------------------------------------
   Coverage ribbon
   ------------------------------------------------------------------ */
function renderRibbon() {
  const withDocs = MODEL.list.filter(i => i.docs.length).length;
  const total = MODEL.list.length;

  document.getElementById("ribbon").innerHTML = MODEL.list.map(i =>
    `<button class="tick${i.docs.length ? " tick--has" : ""}" data-tick="${i.id}"
       title="${esc(i.name)}" aria-label="${esc(i.name)}: ${
         i.docs.length ? plural(i.docs.length, "document", "documents") : "nothing published"}"></button>`
  ).join("");

  setReadout(`<b>${withDocs} of ${total}</b> institutions have published generative-AI guidance. Each tick is one institution.`);
}

const setReadout = html => { document.getElementById("ribbon-read").innerHTML = html; };

/* ------------------------------------------------------------------
   Compare
   ------------------------------------------------------------------ */
const CMP_MAX = 4;

function refreshCmpBar() {
  const bar = document.getElementById("cmpbar");
  bar.dataset.show = picked.size ? "1" : "0";
  document.getElementById("cmpbar-text").textContent =
    `${plural(picked.size, "institution", "institutions")} selected`;
  document.getElementById("cmpbar-go").disabled = picked.size < 2;
}

function openCompare() {
  const chosen = [...picked].map(id => MODEL.byId[id]).filter(Boolean);
  const cell = v => (v && v.length) ? v : '<span class="dash">—</span>';
  const list = a => a.length ? `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";

  const rows = [
    ["Province",     i => esc(i.province)],
    ["City",         i => esc(i.city)],
    ["Type",         i => esc(i.kind)],
    ["Language",     i => esc(i.language)],
    ["Documents",    i => i.docs.length ? String(i.docs.length) : ""],
    ["Document types", i => list(i.types)],
    ["Issued by",    i => list(i.issuers)],
    ["Audience",     i => list(i.audiences)],
    ["Stance",       i => list([...new Set(i.docs.map(d => d.stance).filter(Boolean))])],
    ["Links",        i => i.docs.filter(d => d.url).map(d =>
        `<div style="margin-bottom:5px"><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${
          esc(d.title || d.type || "Open")}</a></div>`).join("")],
  ];

  document.getElementById("cmp-body").innerHTML = `
    <table class="cmp-table">
      <thead><tr><th scope="col"><span class="sr-only">Attribute</span></th>
        ${chosen.map(i => `<th scope="col">${esc(i.name)}</th>`).join("")}</tr></thead>
      <tbody>
        ${rows.map(([label, fn]) => `<tr>
          <th scope="row">${label}</th>
          ${chosen.map(i => `<td>${cell(fn(i))}</td>`).join("")}
        </tr>`).join("")}
      </tbody>
    </table>`;

  const sheet = document.getElementById("cmp-sheet");
  sheet.dataset.show = "1";
  document.getElementById("cmp-close").focus();
}

const closeCompare = () => { document.getElementById("cmp-sheet").dataset.show = "0"; };

/* ------------------------------------------------------------------
   URL state — every view is a shareable link
   ------------------------------------------------------------------ */
function syncUrl() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.province) p.set("province", state.province);
  if (state.issuer) p.set("issuer", state.issuer);
  if (state.type) p.set("type", state.type);
  if (state.status) p.set("status", state.status);
  if (state.audience.size) p.set("audience", [...state.audience].join(","));
  const qs = p.toString();
  history.replaceState(null, "", qs ? "?" + qs + location.hash : location.pathname + location.hash);
}

function readUrl() {
  const p = new URLSearchParams(location.search);
  state.q        = p.get("q") || "";
  state.province = p.get("province") || "";
  state.issuer   = p.get("issuer") || "";
  state.type     = p.get("type") || "";
  state.status   = p.get("status") || "";
  (p.get("audience") || "").split(",").filter(Boolean).forEach(a => state.audience.add(a));
}

function resetAll() {
  state.q = state.province = state.issuer = state.type = state.status = "";
  state.audience.clear();
  document.getElementById("q").value = "";
  ["f-province", "f-issuer", "f-type", "f-status"].forEach(id => document.getElementById(id).value = "");
  document.querySelectorAll("#f-audience .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  render();
}

/* ------------------------------------------------------------------
   Wiring
   ------------------------------------------------------------------ */
function fillSelect(id, values, current) {
  const sel = document.getElementById(id);
  const first = sel.options[0];
  sel.innerHTML = "";
  sel.appendChild(first);
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = o.textContent = v;
    sel.appendChild(o);
  });
  if (current) sel.value = current;
}

function buildControls() {
  fillSelect("f-province",
    [...new Set(MODEL.list.map(i => i.province))].filter(Boolean).sort(), state.province);
  fillSelect("f-issuer",
    [...new Set(MODEL.list.flatMap(i => i.issuers))].sort(), state.issuer);
  fillSelect("f-type",
    [...new Set(MODEL.list.flatMap(i => i.types))].sort(), state.type);
  document.getElementById("f-status").value = state.status;

  const present = new Set(MODEL.list.flatMap(i => i.audiences));
  document.getElementById("f-audience").innerHTML = AUDIENCES
    .filter(a => present.has(a))
    .map(a => `<button class="chip" type="button" data-aud="${a}"
                 aria-pressed="${state.audience.has(a)}">${a}</button>`).join("");
}

let typingTimer;
document.getElementById("q").addEventListener("input", e => {
  clearTimeout(typingTimer);
  const v = e.target.value;
  typingTimer = setTimeout(() => { state.q = v; render(); }, 110);
});
document.getElementById("q-clear").onclick = () => {
  document.getElementById("q").value = ""; state.q = ""; render();
  document.getElementById("q").focus();
};

["province", "issuer", "type", "status"].forEach(key => {
  document.getElementById("f-" + key).addEventListener("change", e => {
    state[key] = e.target.value; render();
  });
});

document.getElementById("f-audience").addEventListener("click", e => {
  const btn = e.target.closest("[data-aud]");
  if (!btn) return;
  const a = btn.dataset.aud;
  state.audience.has(a) ? state.audience.delete(a) : state.audience.add(a);
  btn.setAttribute("aria-pressed", state.audience.has(a));
  render();
});

document.getElementById("reset").onclick = resetAll;

document.getElementById("filters-toggle").onclick = e => {
  const btn = e.currentTarget;
  const on = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!on));
  document.getElementById("filters").dataset.open = on ? "0" : "1";
};

document.getElementById("expand-all").onclick = () => {
  const hits = MODEL.list.filter(passes).filter(i => i.docs.length);
  const allOpen = hits.every(i => open.has(i.id));
  hits.forEach(i => allOpen ? open.delete(i.id) : open.add(i.id));
  render();
};

/* Card expansion + compare checkboxes, delegated so re-renders are cheap */
document.getElementById("results").addEventListener("click", e => {
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) {
    const id = toggle.dataset.toggle;
    open.has(id) ? open.delete(id) : open.add(id);
    const card = document.getElementById(id);
    const docs = document.getElementById("docs-" + id);
    const isOpen = open.has(id);
    card.dataset.open = isOpen ? "1" : "0";
    docs.hidden = !isOpen;
    toggle.setAttribute("aria-expanded", String(isOpen));
    return;
  }
});

document.getElementById("results").addEventListener("change", e => {
  const box = e.target.closest("[data-cmp]");
  if (!box) return;
  const id = box.dataset.cmp;
  if (box.checked) {
    if (picked.size >= CMP_MAX) {
      box.checked = false;
      setReadout(`You can compare up to ${CMP_MAX} institutions at once.`);
      return;
    }
    picked.add(id);
  } else picked.delete(id);
  refreshCmpBar();
});

document.getElementById("cmpbar-go").onclick = openCompare;
document.getElementById("cmpbar-clear").onclick = () => {
  picked.clear();
  document.querySelectorAll("[data-cmp]").forEach(b => b.checked = false);
  refreshCmpBar();
};
document.getElementById("cmp-close").onclick = closeCompare;
document.getElementById("cmp-sheet").addEventListener("click", e => {
  if (e.target.id === "cmp-sheet") closeCompare();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeCompare();
  // "/" focuses search, the way every good directory should
  if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById("q").focus();
  }
});

/* Ribbon interactions */
const ribbon = document.getElementById("ribbon");
ribbon.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tick]");
  if (!t) return;
  const inst = MODEL.byId[t.dataset.tick];
  setReadout(`<b>${esc(inst.name)}</b> — ${
    inst.docs.length ? plural(inst.docs.length, "document", "documents") : "nothing published yet"}`);
});
ribbon.addEventListener("mouseleave", () => {
  const withDocs = MODEL.list.filter(i => i.docs.length).length;
  setReadout(`<b>${withDocs} of ${MODEL.list.length}</b> institutions have published generative-AI guidance. Each tick is one institution.`);
});
ribbon.addEventListener("click", e => {
  const t = e.target.closest("[data-tick]");
  if (!t) return;
  const inst = MODEL.byId[t.dataset.tick];
  resetAll();
  open.add(inst.id);
  render();
  const card = document.getElementById(inst.id);
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.add("card--target");
  setTimeout(() => card.classList.remove("card--target"), 2200);
});

/* ------------------------------------------------------------------
   Reflection prompt
   ------------------------------------------------------------------ */
function renderPrompt() {
  const slot = document.getElementById("prompt-slot");
  if (!PROMPTS.length) { slot.innerHTML = ""; return; }
  const pick = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
  slot.innerHTML = `
    <div class="prompt">
      <p class="prompt__label">Something to notice</p>
      <p class="prompt__text">${pick}</p>
      <p class="prompt__foot">
        <a href="insights.html">Read the insights →</a>
        <button class="linkbtn" id="prompt-next" type="button">Show another</button>
      </p>
    </div>`;
  document.getElementById("prompt-next").onclick = renderPrompt;
}

/* ------------------------------------------------------------------
   Boot
   ------------------------------------------------------------------ */
readUrl();
document.getElementById("q").value = state.q;

loadData(data => {
  MODEL = buildModel(data);
  PROMPTS = (data.prompts || []).filter(p => yes(p.Publish)).map(p => p.Prompt).filter(Boolean);

  buildControls();
  renderRibbon();
  renderPrompt();
  render();

  // Deep link to a single institution: index.html#university-of-toronto
  const target = location.hash.slice(1);
  if (target && MODEL.byId[target]) {
    open.add(target);
    render();
    const card = document.getElementById(target);
    card.scrollIntoView({ block: "center" });
    card.classList.add("card--target");
  }
  refreshCmpBar();
});
</script>
</body>
</html>
